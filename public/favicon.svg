<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="salgado.zip">
  <!--
    Um aglomerado de dois cristais de sal-gema: é assim que a halite cresce,
    cubos a nuclear uns sobre os outros. Diz o nome sem gastar uma letra.

    A geometria é projeção isométrica exata (cos 30°), não desenho a olho: para
    aresta s, o vértice de topo em (x, y) dá o direito em (x + s·cos30, y + s/2),
    o centro em (x, y + s) e o esquerdo em (x − s·cos30, y + s/2); as três
    arestas de baixo descem s. Cubo grande s = 10,4 em (13,6 · 9,0); cristal de
    cima s = 5,4 em (20,6 · 4,4), desenhado depois para ficar à frente.

    As arestas interiores levam a cor da placa, ou seja, são cortes na massa e
    não linhas por cima dela. A 1,9 separam as três faces sem as comer — foi
    medido nos PNG de 16×16, que é o tamanho que o separador do browser usa.
  -->
  <style>
    .placa { fill: #14130f }
    .sal   { fill: #fbfaf7 }
    .corte { stroke: #14130f; fill: none; stroke-linejoin: round; stroke-linecap: round }
    @media (prefers-color-scheme: dark) {
      .placa { fill: #f2efe8 }
      .sal   { fill: #14130f }
      .corte { stroke: #f2efe8 }
    }
  </style>
  <rect class="placa" width="32" height="32" rx="6" />

  <path class="sal" d="M13.60 9.00 L22.61 14.20 L22.61 24.60 L13.60 29.80 L4.59 24.60 L4.59 14.20Z" />
  <g class="corte" stroke-width="1.9">
    <path d="M4.59 14.20 L13.60 19.40" />
    <path d="M13.60 19.40 L22.61 14.20" />
    <path d="M13.60 19.40 L13.60 29.80" />
  </g>

  <path class="sal" d="M20.60 4.40 L25.28 7.10 L25.28 12.50 L20.60 15.20 L15.92 12.50 L15.92 7.10Z" />
  <g class="corte" stroke-width="1.9">
    <path d="M15.92 7.10 L20.60 9.80" />
    <path d="M20.60 9.80 L25.28 7.10" />
    <path d="M20.60 9.80 L20.60 15.20" />
  </g>
</svg>
