name: verify

# Um ramo com PR aberto disparava duas corridas por envio, uma por `push` e
# outra por `pull_request`. O `push` fica só para o ramo principal.
on:
  push:
    branches: [main]
  pull_request:

# Envios seguidos cancelam a corrida anterior do mesmo ramo.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O ambiente de desenvolvimento já traz o Chromium; um runner do GitHub
      # não. scripts/browser.mjs usa CHROMIUM_PATH ou /opt/pw-browsers/chromium
      # quando existem, e cai na resolução do próprio Playwright caso contrário.
      # Sem cache são 104 MB descarregados a cada corrida.
      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar o Chromium (só no runner)
        run: npx playwright install --with-deps chromium

      - name: npm run verify
        run: npm run verify

      # As oito capturas ficam disponíveis no separador de artefactos da
      # execução: a verificação 15 é a única que precisa de olho humano.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-a-vista
          path: .verify/
          retention-days: 14
          # .verify/ começa por ponto: sem isto o upload não encontra nada.
          include-hidden-files: true
