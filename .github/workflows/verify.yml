name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O ambiente de desenvolvimento já traz o Chromium; um runner do GitHub
      # não. scripts/browser.mjs usa CHROMIUM_PATH ou /opt/pw-browsers/chromium
      # quando existem, e cai na resolução do próprio Playwright caso contrário.
      - name: Instalar o Chromium (só no runner)
        run: npx playwright install --with-deps chromium

      - name: npm run verify
        run: npm run verify

      # As oito capturas ficam disponíveis no separador de artefactos da
      # execução: a verificação 13 é a única que precisa de olho humano.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-a-vista
          path: .verify/
          retention-days: 14
